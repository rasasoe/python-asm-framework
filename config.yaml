target:
  ip: 127.0.0.1
  base_url: http://127.0.0.1:3000
  swagger_path: /api-docs/swagger.yaml

authorization:
  acknowledged: false      # 소유권 또는 명시적 허가를 확인한 뒤 true로 변경
  allowed_targets:
    - 127.0.0.1

collection:
  run_nse_safe: false     # Windows에서 nmap NSE 경로/권한 이슈 있으면 false 권장
  run_selenium: false     # Chrome 설치되어 있어야 함 (임시 비활성화)
  selenium_max_buttons: 80

vulners:
  enabled: false
  api_key: "PUT_YOUR_VULNERS_API_KEY_HERE"
  per_service_limit: 8

nvd:
  enabled: false
  api_key: ""             # 있으면 rate-limit 완화에 도움
  enrich_top_n: 5          # 상위 CVE N개만 NVD로 보강

risk:
  public_scan: false       # 인터넷 노출 자산으로 승인된 경우에만 true
